<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>EranTerm Debug Console</title>
<style>
  :root { --bg: #0b0d10; --panel: #111418; --line: #232830; --fg: #e3e6eb; --muted: #7d8590; --accent: #3ddc5f; --warn: #f0a33a; --error: #f05252; color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f7f9; --panel: #fff; --line: #d9dde3; --fg: #1d2127; --muted: #626b76; --accent: #1a9a3a; --warn: #b86e0b; --error: #d23c3c; color-scheme: light; }
  }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 13px -apple-system, system-ui, sans-serif; }
  header { display: flex; gap: 6px; align-items: center; padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header .grow { flex: 1; }
  input, button, select { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; font: inherit; }
  input { width: 240px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  label { display: flex; gap: 4px; align-items: center; color: var(--muted); }
  #out { flex: 1; overflow: auto; margin: 0; padding: 8px 10px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-all; }
  .WARN { color: var(--warn); } .ERROR { color: var(--error); }
  #count { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <header>
    <input id="q" type="search" placeholder="Filter…" spellcheck="false">
    <select id="lvl"><option value="">All levels</option><option value="WARN|ERROR">Warnings + errors</option><option value="ERROR">Errors</option></select>
    <label><input id="follow" type="checkbox" checked style="width:auto"> Follow</label>
    <span id="count"></span>
    <span class="grow"></span>
    <button id="copy">Copy</button>
    <button id="clear">Clear</button>
    <button id="folder" title="Open the log file folder (Settings → Logging)">Log folder</button>
  </header>
  <pre id="out"></pre>
  <script src="debug.js"></script>
</body>
</html>
