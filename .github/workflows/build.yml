name: Build installers

# PR into main (opened / new commits): test + build installers (downloadable from the run, no release).
# PR merged into main: build again from the merge commit and publish a GitHub Release.
# Direct pushes (to dev or main) do nothing.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write

jobs:
  build:
    if: github.event.action != 'closed' || github.event.pull_request.merged
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # ponytail: build number = run number, never committed back (no bot pushes / loops).
      # Bump major.minor in package.json by hand; the patch comes from CI.
      - name: Set version
        shell: bash
        run: npm version "$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')").${{ github.run_number }}" --no-git-tag-version
      - run: npx electron-builder ${{ matrix.os == 'macos-latest' && '--mac' || '--win' }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # unsigned; drop this once you add signing certs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          # .yml + .zip + .blockmap are the auto-update feed; electron-updater reads them from the release.
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/latest*.yml
            dist/*.blockmap

  release:
    needs: build
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')").${{ github.run_number }}"
          gh release create "v$V" out/* --title "EranTerm $V" --generate-notes --target "${{ github.event.pull_request.merge_commit_sha }}"
